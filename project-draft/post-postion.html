<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- <meta name="author" content="Tony Li & Thomas Gustafson">
    <meta name="description" content="Homepage"> -->
    <link rel="stylesheet" href="css/style.css">
    <title>Post</title>
</head>
<body class="post">
    <section class="navbar"> 
        <div class="homepage-nav-container">
            <h1>InternShipper</h1>
            <form class="search-bar">
                <input type="text" placeholder="Search...">
            </form>
            <div class="post-home-button">
                <button>Home</button>
            </div>
        </div>
    </section>
    <section class="post-content">
        <div class="post-box">
            <form class="Position">
                <label class="label-position" for="position">Postion</label>
                <input id="position" type="text" name="position" placeholder="Position Title">
            </form>
            <form class="Location">
                <label class="label-small" for="location">Location</label>
                <input id="location" type="text" name="location" placeholder="Location">
            </form> 
            <form class="BasePay">
                <label class="label-small" for="basepay">Base Pay</label>
                <input id="basepay" type="text" name="basepay" placeholder="Base Pay">
            </form> 
            <form class="Body">
                <label class="label-small" for="body">Description</label>
                <textarea id="body" name="body" class="body-textarea"> </textarea>
            </form>
            <div class="post-button-container">
                <div class="left-actions">
                    <button type="button" class="post-submit-button">Post</button>
                    <button type="button" class="post-cancel-button" onclick="window.location.href='empty-post.html'">Cancel</button>
                </div>

                <form class="Tags">
                    <label class="label-small" for="tags">Tags</label>
                    <input id="tags" type="text" name="tags" placeholder="#Tags">
                </form>
            </div>  
        </div>
    </section>
</body>
<footer>
    <p>Copy right: ... Contact Info: ...</p> <!-- update this part later -->
</footer>
</html>
