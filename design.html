<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="author" content="Tony Li & Thomas Gustafson">
    <meta name="description" content="Designing space">
    <link rel="stylesheet" href="design.css">
    <title>Homepage</title>
</head>
<body>
    <div class="intern-card">
        <div class="card-header">
            <div class="logo-circle">T</div>
        </div>

        <div class="card-body">
            <h3 class="job-title">Software Intern @ TechNova Labs</h3>

            <p class="location">
            Seattle, WA — <span class="pay">$22/hr</span>
            </p>

            <p class="description">
            Assist with feature development and debugging<br>
            on internal tools.
            </p>

            <div class="tags">
                <span>#software</span>
                <span>#internshiip</span>
            </div>

            <div class="cards-buttons-container">
                <button class="mail-btn">mail</button>
                <button class="apply-btn">Apply</button>
            </div>
        </div>
    </div>

</body>
</html>
